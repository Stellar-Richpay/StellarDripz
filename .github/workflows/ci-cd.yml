name: StellarDripz CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_TOOLCHAIN: "stable"

jobs:
  # ─── Contract Tests ───────────────────────────────────────────────
  contract-tests:
    name: 🔧 Smart Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run contract unit tests
        run: cargo test --verbose -- --nocapture

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint contracts (clippy, warnings denied)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build WASM (check compilation)
        run: cargo build --target wasm32v1-none --release

      - name: Check WASM output
        run: |
          WASM_PATH="target/wasm32v1-none/release/stellardripz.wasm"
          if [ -f "$WASM_PATH" ]; then
            SIZE=$(stat -c%s "$WASM_PATH" 2>/dev/null || echo "0")
            echo "✅ WASM built: $(( SIZE / 1024 )) KB"
          else
            echo "⚠️  WASM not found at $WASM_PATH — checking alternative paths..."
            find target/ -name "*.wasm" 2>/dev/null || true
          fi

      # Soroban's test harness writes a ledger snapshot for every test under
      # contracts/test_snapshots, and the repo tracks them. A new test whose
      # snapshot was never committed (or a contract change that altered env
      # state without refreshing the snapshots) would otherwise slip through
      # green here and drift on every checkout. Failing on a dirty tree makes
      # the snapshot set a first-class part of the contract diff.
      - name: Ensure test snapshots are committed and current
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ cargo test produced or modified tracked files (snapshots):"
            git status --porcelain
            exit 1
          fi
          echo "✅ Snapshot tree is clean"

  # ─── Frontend Tests ───────────────────────────────────────────────
  frontend-tests:
    name: 🧪 Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test -- --verbose --coverage --coverageThreshold='{"global":{"branches":45,"functions":50,"lines":55,"statements":55}}'

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ─── Lint ─────────────────────────────────────────────────────────
  lint:
    name: 📋 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ─── Build ────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build
    needs: [contract-tests, frontend-tests, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Check build output
        run: |
          if [ -d ".next" ]; then
            echo "✅ Build successful"
            ls -la .next
          else
            echo "❌ Build failed"
            exit 1
          fi

  # ─── Deploy Gate (Vercel credentials) ────────────────────────────
  # The `secrets` context is not available inside a job-level `if`, so the
  # deploy jobs gate on an output produced by a *step*, where secrets are
  # readable. Referencing `secrets` at job level makes the whole workflow file
  # invalid, which GitHub reports as a run that fails in 0s with zero jobs.
  deploy-gate:
    name: 🔐 Vercel Credentials
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check whether Vercel credentials are configured
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ Vercel credentials present — deploys enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Vercel credentials missing — skipping deploys (set VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID)."
          fi

  # ─── Deploy Preview (Vercel) ─────────────────────────────────────
  deploy-preview:
    name: 🚀 Deploy Preview
    if: github.event_name == 'pull_request' && needs.deploy-gate.outputs.enabled == 'true'
    needs: [build, deploy-gate]
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      # The build runs on Vercel, so values default to the project's own
      # environment settings; any public var configured on the repo is passed
      # through explicitly (empty ones are skipped so they cannot blank out the
      # project configuration).
      - name: Deploy to Vercel (preview)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SOROBAN_RPC_URL: ${{ vars.NEXT_PUBLIC_SOROBAN_RPC_URL }}
          NEXT_PUBLIC_HORIZON_URL: ${{ vars.NEXT_PUBLIC_HORIZON_URL }}
          NEXT_PUBLIC_STELLAR_NETWORK: ${{ vars.NEXT_PUBLIC_STELLAR_NETWORK }}
          NEXT_PUBLIC_CONTRACT_COUNTER: ${{ vars.NEXT_PUBLIC_CONTRACT_COUNTER }}
          NEXT_PUBLIC_CONTRACT_DRIP_TOKEN: ${{ vars.NEXT_PUBLIC_CONTRACT_DRIP_TOKEN }}
          NEXT_PUBLIC_CONTRACT_DRIP_POOL: ${{ vars.NEXT_PUBLIC_CONTRACT_DRIP_POOL }}
          NEXT_PUBLIC_CONTRACT_GOVERNANCE: ${{ vars.NEXT_PUBLIC_CONTRACT_GOVERNANCE }}
          NEXT_PUBLIC_CONTRACT_BADGE: ${{ vars.NEXT_PUBLIC_CONTRACT_BADGE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          args=()
          for key in NEXT_PUBLIC_SOROBAN_RPC_URL NEXT_PUBLIC_HORIZON_URL NEXT_PUBLIC_STELLAR_NETWORK NEXT_PUBLIC_CONTRACT_COUNTER NEXT_PUBLIC_CONTRACT_DRIP_TOKEN NEXT_PUBLIC_CONTRACT_DRIP_POOL NEXT_PUBLIC_CONTRACT_GOVERNANCE NEXT_PUBLIC_CONTRACT_BADGE NEXT_PUBLIC_SUPABASE_URL; do
            [ -n "${!key}" ] && args+=(-e "$key=${!key}")
          done
          npx --yes vercel@latest deploy --yes --token="$VERCEL_TOKEN" "${args[@]}" > /tmp/vercel-deploy.log 2>&1 || { cat /tmp/vercel-deploy.log; exit 1; }
          cat /tmp/vercel-deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' /tmp/vercel-deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "🔍 Preview deployment: $url" >> "$GITHUB_STEP_SUMMARY"

  # ─── Deploy Production ───────────────────────────────────────────
  deploy-production:
    name: 🌐 Deploy Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-gate.outputs.enabled == 'true'
    needs: [build, deploy-gate]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://stellardripz.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SOROBAN_RPC_URL: ${{ vars.NEXT_PUBLIC_SOROBAN_RPC_URL }}
          NEXT_PUBLIC_HORIZON_URL: ${{ vars.NEXT_PUBLIC_HORIZON_URL }}
          NEXT_PUBLIC_STELLAR_NETWORK: ${{ vars.NEXT_PUBLIC_STELLAR_NETWORK }}
          NEXT_PUBLIC_CONTRACT_COUNTER: ${{ vars.NEXT_PUBLIC_CONTRACT_COUNTER }}
          NEXT_PUBLIC_CONTRACT_DRIP_TOKEN: ${{ vars.NEXT_PUBLIC_CONTRACT_DRIP_TOKEN }}
          NEXT_PUBLIC_CONTRACT_DRIP_POOL: ${{ vars.NEXT_PUBLIC_CONTRACT_DRIP_POOL }}
          NEXT_PUBLIC_CONTRACT_GOVERNANCE: ${{ vars.NEXT_PUBLIC_CONTRACT_GOVERNANCE }}
          NEXT_PUBLIC_CONTRACT_BADGE: ${{ vars.NEXT_PUBLIC_CONTRACT_BADGE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          args=()
          for key in NEXT_PUBLIC_SOROBAN_RPC_URL NEXT_PUBLIC_HORIZON_URL NEXT_PUBLIC_STELLAR_NETWORK NEXT_PUBLIC_CONTRACT_COUNTER NEXT_PUBLIC_CONTRACT_DRIP_TOKEN NEXT_PUBLIC_CONTRACT_DRIP_POOL NEXT_PUBLIC_CONTRACT_GOVERNANCE NEXT_PUBLIC_CONTRACT_BADGE NEXT_PUBLIC_SUPABASE_URL; do
            [ -n "${!key}" ] && args+=(-e "$key=${!key}")
          done
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" "${args[@]}" 2>&1 | tee /tmp/vercel-deploy.log
          grep -qE 'https://[a-zA-Z0-9.-]+\.vercel\.app' /tmp/vercel-deploy.log
          echo "🌐 Production: https://stellardripz.vercel.app" >> "$GITHUB_STEP_SUMMARY"

      # A deploy that reports READY can still be broken for visitors: the pitch
      # video may be missing, mistyped or truncated, or the hero links may have
      # gone. Check the live alias rather than trusting the deploy status.
      - name: Smoke test the production deployment
        run: node scripts/smoke-deploy.mjs
        env:
          SMOKE_BASE_URL: https://stellardripz.vercel.app
# CI/CD pipeline: contracts → tests → lint → build → deploy
