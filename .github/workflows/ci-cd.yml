name: StellarDripz CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_TOOLCHAIN: "stable"

jobs:
  # ─── Contract Tests ───────────────────────────────────────────────
  contract-tests:
    name: 🔧 Smart Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run contract unit tests
        run: cargo test --verbose -- --nocapture

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint contracts (clippy, warnings denied)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build WASM (check compilation)
        run: cargo build --target wasm32v1-none --release

      - name: Check WASM output
        run: |
          WASM_PATH="target/wasm32v1-none/release/stellardripz.wasm"
          if [ -f "$WASM_PATH" ]; then
            SIZE=$(stat -c%s "$WASM_PATH" 2>/dev/null || echo "0")
            echo "✅ WASM built: $(( SIZE / 1024 )) KB"
          else
            echo "⚠️  WASM not found at $WASM_PATH — checking alternative paths..."
            find target/ -name "*.wasm" 2>/dev/null || true
          fi

  # ─── Frontend Tests ───────────────────────────────────────────────
  frontend-tests:
    name: 🧪 Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test -- --verbose --coverage --coverageThreshold='{"global":{"branches":45,"functions":50,"lines":55,"statements":55}}'

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ─── Lint ─────────────────────────────────────────────────────────
  lint:
    name: 📋 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ─── Build ────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build
    needs: [contract-tests, frontend-tests, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Check build output
        run: |
          if [ -d ".next" ]; then
            echo "✅ Build successful"
            ls -la .next
          else
            echo "❌ Build failed"
            exit 1
          fi

  # ─── Deploy Preview (Vercel) ─────────────────────────────────────
  deploy-preview:
    name: 🚀 Deploy Preview
    if: github.event_name == 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (preview)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod=false"
        env:
          NEXT_PUBLIC_SOROBAN_RPC_URL: ${{ vars.NEXT_PUBLIC_SOROBAN_RPC_URL }}
          NEXT_PUBLIC_HORIZON_URL: ${{ vars.NEXT_PUBLIC_HORIZON_URL }}
          NEXT_PUBLIC_STELLAR_NETWORK: ${{ vars.NEXT_PUBLIC_STELLAR_NETWORK }}
          NEXT_PUBLIC_CONTRACT_COUNTER: ${{ vars.NEXT_PUBLIC_CONTRACT_COUNTER }}
          NEXT_PUBLIC_CONTRACT_DRIP_TOKEN: ${{ vars.NEXT_PUBLIC_CONTRACT_DRIP_TOKEN }}
          NEXT_PUBLIC_CONTRACT_DRIP_POOL: ${{ vars.NEXT_PUBLIC_CONTRACT_DRIP_POOL }}
          NEXT_PUBLIC_CONTRACT_GOVERNANCE: ${{ vars.NEXT_PUBLIC_CONTRACT_GOVERNANCE }}
          NEXT_PUBLIC_CONTRACT_BADGE: ${{ vars.NEXT_PUBLIC_CONTRACT_BADGE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # ─── Deploy Production ───────────────────────────────────────────
  deploy-production:
    name: 🌐 Deploy Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://stellardripz.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
        env:
          NEXT_PUBLIC_SOROBAN_RPC_URL: ${{ vars.NEXT_PUBLIC_SOROBAN_RPC_URL }}
          NEXT_PUBLIC_HORIZON_URL: ${{ vars.NEXT_PUBLIC_HORIZON_URL }}
          NEXT_PUBLIC_STELLAR_NETWORK: ${{ vars.NEXT_PUBLIC_STELLAR_NETWORK }}
          NEXT_PUBLIC_CONTRACT_COUNTER: ${{ vars.NEXT_PUBLIC_CONTRACT_COUNTER }}
          NEXT_PUBLIC_CONTRACT_DRIP_TOKEN: ${{ vars.NEXT_PUBLIC_CONTRACT_DRIP_TOKEN }}
          NEXT_PUBLIC_CONTRACT_DRIP_POOL: ${{ vars.NEXT_PUBLIC_CONTRACT_DRIP_POOL }}
          NEXT_PUBLIC_CONTRACT_GOVERNANCE: ${{ vars.NEXT_PUBLIC_CONTRACT_GOVERNANCE }}
          NEXT_PUBLIC_CONTRACT_BADGE: ${{ vars.NEXT_PUBLIC_CONTRACT_BADGE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
# CI/CD pipeline: contracts → tests → lint → build → deploy
