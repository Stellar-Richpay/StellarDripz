name: Lint (Strict)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  eslint-strict:
    name: ESLint Strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - run: npm ci
      - run: npx eslint . --max-warnings 0

  prettier:
    name: Prettier Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - run: npm ci
      # Use the canonical format:check script rather than an inline glob so
      # the check covers e2e/ too and always matches what `npm run format`
      # writes locally — an inline pattern here silently skipped e2e files.
      - run: npm run format:check
