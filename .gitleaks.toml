# Gitleaks configuration for StellarDripz
# Prevents false positives from test fixtures and placeholder values.

title = "StellarDripz Gitleaks Config"

[extend]
useDefault = true

[allowlist]
  description = "False positives from test fixtures, docs, and example keys"

  # Stellar placeholder public key (G-address) used throughout contracts
  regexes = [
    '''GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF''',
    # Stellar testnet/futurenet network passphrases and public network identifiers
    '''(Test SDF (Network|Future Network|Network ; September 2015)|Public Global Stellar Network ; September 2015)''',
    # Placeholder/sample secret keys in test fixtures
    '''S[A-Z0-9]{55}''',
  ]

  # Path-level allowlist for files that contain known safe content
  paths = [
    '''src/__tests__/''',
    '''contracts/test_snapshots/''',
    '''screenshots/''',
    '''demo/''',
    # Env templates with truncated/commented placeholders only — real .env
    # files are gitignored and would still be flagged.
    '''\.env\.example''',
    '''\.env\.local\.example''',
    '''docs/WHITEPAPER\.md''',
    '''CHANGELOG.md''',
    '''CONTRIBUTING.md''',
    '''README.md''',
    '''SECURITY.md''',
    '''SECURITY_HOF.md''',
    '''CODE_OF_CONDUCT.md''',
    '''LICENSE''',
    '''.cspell.json''',
    '''.github/''',
  ]