<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StellarDripz pitch — stage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /*
       * The stage is a determinstic canvas: every animated value is written by
       * stage.js from the show's keyframes, so NO CSS animation or transition
       * may appear here — wall-clock animations would make frames unrepeatable.
       */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { background: #020617; }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #020617;
        font-family: "Inter", system-ui, sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }

      /* ---- base background ---- */
      #bg { position: absolute; inset: 0; }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
        background-size: 60px 60px;
      }
      .glow { position: absolute; border-radius: 50%; filter: blur(90px); }

      /* ---- scenes ---- */
      .scene { position: absolute; inset: 0; will-change: opacity, transform; }
      .layer { position: absolute; will-change: opacity, transform; }

      /* ---- images ---- */
      .imgwrap {
        overflow: hidden;
        background: #0b1120;
        box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.85);
      }
      .imgwrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .frame { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
      .chrome {
        position: absolute; left: 0; right: 0; top: 0; height: 44px;
        display: flex; align-items: center; gap: 10px;
        background: rgba(15, 23, 42, 0.96);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .dots { display: flex; gap: 8px; margin-left: 18px; }
      .dot { width: 12px; height: 12px; border-radius: 50%; }
      .chrome-title {
        margin-left: 12px; font-size: 15px; color: rgba(255, 255, 255, 0.5);
        font-weight: 500; letter-spacing: 0.01em;
      }
      .chrome-url {
        margin-left: auto; margin-right: 18px; font-family: "JetBrains Mono", monospace;
        font-size: 13px; color: rgba(255, 255, 255, 0.38);
      }

      /* ---- text ---- */
      .txt { white-space: pre-wrap; }
      .kicker {
        font-size: 22px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase;
        color: rgba(107, 138, 255, 0.95);
      }
      .h1 { font-size: 88px; font-weight: 800; line-height: 1.05; letter-spacing: -0.03em; }
      .h2 { font-size: 54px; font-weight: 800; line-height: 1.12; letter-spacing: -0.02em; }
      .h3 { font-size: 36px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; }
      .body { font-size: 30px; font-weight: 400; line-height: 1.45; color: rgba(255, 255, 255, 0.72); }
      .small { font-size: 22px; font-weight: 400; line-height: 1.5; color: rgba(255, 255, 255, 0.55); }
      .mono { font-family: "JetBrains Mono", monospace; }
      .grad {
        background: linear-gradient(92deg, #3e63dd 0%, #8b5cf6 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .stat { font-size: 96px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
      .stat-label { font-size: 24px; font-weight: 500; color: rgba(255, 255, 255, 0.5); }

      .chip {
        display: inline-flex; align-items: center; gap: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.045);
        border-radius: 999px; padding: 14px 26px;
        font-size: 24px; font-weight: 600; color: rgba(255, 255, 255, 0.86);
      }
      .chip-danger {
        border-color: rgba(239, 68, 68, 0.32);
        background: rgba(239, 68, 68, 0.08);
        color: rgba(252, 165, 165, 0.95);
      }
      .card {
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: linear-gradient(160deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.75));
        border-radius: 26px; padding: 30px;
        box-shadow: 0 40px 90px -40px rgba(0, 0, 0, 0.9);
      }
      .card-accent { border-color: rgba(62, 99, 221, 0.4); }
      .card-green { border-color: rgba(16, 185, 129, 0.35); }

      /* ---- highlight boxes ---- */
      .box { border-radius: 18px; }
      .spot {
        border: 2.5px solid rgba(107, 138, 255, 0.95);
        background: rgba(62, 99, 221, 0.12);
        box-shadow: 0 0 0 6px rgba(62, 99, 221, 0.12), 0 0 60px rgba(62, 99, 221, 0.35);
        border-radius: 16px;
      }
      .spot-green {
        border-color: rgba(16, 185, 129, 0.95);
        background: rgba(16, 185, 129, 0.1);
        box-shadow: 0 0 0 6px rgba(16, 185, 129, 0.12), 0 0 60px rgba(16, 185, 129, 0.3);
      }
      .callout {
        border: 1px solid rgba(107, 138, 255, 0.4);
        background: rgba(9, 14, 32, 0.92);
        border-radius: 14px; padding: 12px 18px;
        font-size: 22px; font-weight: 600; color: rgba(226, 232, 240, 0.95);
        box-shadow: 0 24px 50px -20px rgba(0, 0, 0, 0.9);
      }
      .callout-green { border-color: rgba(16, 185, 129, 0.45); }

      /* ---- panels (code / terminal) ---- */
      .panel {
        overflow: hidden; border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(4, 8, 22, 0.96);
        box-shadow: 0 50px 100px -40px rgba(0, 0, 0, 0.95);
      }
      .panel-bar {
        height: 52px; display: flex; align-items: center; gap: 12px;
        padding: 0 22px; background: rgba(15, 23, 42, 0.95);
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }
      .panel-bar .dot { width: 11px; height: 11px; }
      .panel-title { font-size: 17px; font-weight: 600; color: rgba(226, 232, 240, 0.72); }
      .panel-sub { margin-left: auto; font-size: 13px; color: rgba(148, 163, 184, 0.6); }
      .panel-body {
        position: relative; padding: 20px 26px;
        font-family: "JetBrains Mono", monospace; font-size: 17px; line-height: 1.62;
      }
      .panel-body.tight { font-size: 15.5px; line-height: 1.5; }
      .row { display: flex; gap: 18px; white-space: pre; }
      .ln { color: rgba(148, 163, 184, 0.32); width: 42px; text-align: right; flex: none; }
      .row.hl { background: rgba(62, 99, 221, 0.14); box-shadow: inset 3px 0 0 rgba(107, 138, 255, 0.9); }
      .row.sweep { background: rgba(139, 92, 246, 0.16); }
      .tk-plain { color: #dbe4ff; }
      .tk-kw { color: #c084fc; }
      .tk-str { color: #6ee7b7; }
      .tk-num { color: #fbbf24; }
      .tk-com { color: #64748b; font-style: italic; }
      .tk-type { color: #7dd3fc; }
      .tk-fn { color: #93c5fd; }
      .tk-punct { color: #94a3b8; }
      .tline { white-space: pre-wrap; }
      .t-ok { color: #34d399; }
      .t-bad { color: #f87171; }
      .t-dim { color: rgba(148, 163, 184, 0.65); }
      .t-bold { color: #e2e8f0; font-weight: 700; }
      .t-warn { color: #fbbf24; }

      /* ---- diagram ---- */
      .diagram svg { overflow: visible; }
      .dnode rect { fill: rgba(15, 23, 42, 0.92); stroke: rgba(255, 255, 255, 0.14); stroke-width: 2; }
      .dnode.blue rect { stroke: rgba(62, 99, 221, 0.75); fill: rgba(23, 36, 78, 0.9); }
      .dnode.purple rect { stroke: rgba(139, 92, 246, 0.75); fill: rgba(45, 27, 84, 0.85); }
      .dnode.green rect { stroke: rgba(16, 185, 129, 0.7); fill: rgba(6, 45, 36, 0.85); }
      .dnode.amber rect { stroke: rgba(245, 158, 11, 0.7); fill: rgba(60, 40, 6, 0.85); }
      .dnode text { fill: rgba(226, 232, 240, 0.95); font-size: 24px; font-weight: 600; }
      .dnode text.sub { fill: rgba(148, 163, 184, 0.85); font-size: 18px; font-weight: 400; }
      .dedge { stroke: rgba(148, 163, 184, 0.5); stroke-width: 2.5; fill: none; }
      .dedge.accent { stroke: rgba(107, 138, 255, 0.75); }
      .dedge.flow { stroke-dasharray: 14 12; }
      .dlabel { fill: rgba(203, 213, 225, 0.7); font-size: 16px; font-weight: 500; }

      /* ---- misc ---- */
      .scene-label { position: absolute; display: flex; align-items: center; gap: 16px; }
      .scene-label .bar { width: 5px; height: 30px; border-radius: 3px; background: linear-gradient(#3e63dd, #8b5cf6); }
      .scene-label .txt2 { font-size: 20px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: rgba(255,255,255,0.62); }
      .progress { position: absolute; left: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, #3e63dd, #8b5cf6); }
      .playbadge {
        display: flex; align-items: center; justify-content: center;
        border-radius: 50%; background: rgba(255, 255, 255, 0.14);
        border: 3px solid rgba(255, 255, 255, 0.85);
      }
      .playbadge i {
        width: 0; height: 0; margin-left: 16px;
        border-left: 42px solid #fff; border-top: 26px solid transparent; border-bottom: 26px solid transparent;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="bg">
        <div class="grid"></div>
      </div>
    </div>
    <script type="module" src="/stage.js"></script>
  </body>
</html>
